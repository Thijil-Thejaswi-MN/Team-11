# Nginx Virtual Host Configuration for Team-11 Insurance Workflow
# Implements TLS 1.2+, HSTS, HTTP Redirection, Reverse Proxying & Load Balancing

# 1. Plain HTTP Server (Port 80) -> Redirect all traffic to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 insurance.local host.docker.internal;

    # Expose health check on port 80 for basic liveness probes if needed
    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"nginx-http","redirect_target":"https"}\n';
    }

    # Permanent HTTP-to-HTTPS redirection (RFC 7231 / 301 Moved Permanently)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443) -> TLS Termination, HSTS, Routing
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 127.0.0.1 insurance.local host.docker.internal;

    # SSL Certificate & Private Key (Mounted from host or generated by script)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Strictly TLS 1.2 and TLS 1.3 only (TLS 1.0, TLS 1.1, SSLv3 disabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS Header (SAD §INS-SR-001, STP §TC-Sec-01): 1 year + subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers (Defense in depth / Security Baseline)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Upstream-Backend $upstream_addr always;

    # Gateway Health Endpoint (Port 443 HTTPS)
    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"nginx-tls-reverse-proxy","protocols":["TLSv1.2","TLSv1.3"],"hsts":true}\n';
    }

    # REST API Reverse Proxy -> Load balanced across backend-1 and backend-2
    location /api/v1/ {
        proxy_pass http://backend_cluster/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard Proxy Headers (preserve client IP, protocol, and host)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts and Buffer Sizes
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # Automatic failover to next backend instance on error/timeout
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Response headers
        add_header X-Upstream-Backend $upstream_addr always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Web UI (React SPA) Reverse Proxy
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
