# Nginx Reverse Proxy Configuration (SAD §INS-SR-001, §INS-NF-002, §INS-NF-003)
# - TLS termination with TLS 1.2 and TLS 1.3 only (TLS 1.0/1.1 disabled)
# - HTTP-to-HTTPS automatic 301 redirection
# - Strict-Transport-Security (HSTS) enforcement
# - Load balancing across two backend application instances (backend-1 & backend-2)
# - Upstream health-aware failover and connection keep-alive

# Worker process and connection configuration
# Note: 'user' directive is omitted to use container/OS default (nginx on Alpine, www-data on Debian)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure (INS-SR-001 / security hardening)

    # Detailed access log format capturing timing and backend routing
    log_format timed_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time" '
                             'upstream=$upstream_addr host=$host';

    access_log /var/log/nginx/access.log timed_combined;

    # Gzip compression for static assets and API payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Global SSL/TLS Configuration (SAD §INS-SR-001, STP TC-Sec-01)
    # Strictly TLS 1.2 and TLS 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Upstream backend cluster (2 application instances)
    upstream backend_cluster {
        least_conn; # Distribute load to instance with fewest active connections
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream frontend web service
    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
