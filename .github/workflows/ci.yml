name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Validate repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project documents
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SRS.docx
          test -f SAD.docx
          test -f STP.docx
          echo "All required project documents are present."

      - name: Verify workflow configuration
        run: |
          test -f .github/workflows/ci.yml
          echo "CI workflow configuration exists."

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies reproducibly
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: warn

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Maven verification and automated tests
        working-directory: backend
        run: ./mvnw clean verify

      - name: Upload JaCoCo coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  api-tests:
    name: API Tests (Newman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Newman test runner
        working-directory: tests
        run: npm ci

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Start backend server with test profile
        working-directory: backend
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.useTestClasspath=true -Dspring-boot.run.profiles=test > ../backend.log 2>&1 &
          echo "Backend process launched in background (PID: $!)."

      - name: Wait for backend health endpoint
        run: |
          echo "Waiting for backend service to become healthy at http://localhost:8080/api/v1/actuator/health..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/actuator/health || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Backend is healthy! (attempt $i, HTTP 200)"
              curl -s http://localhost:8080/api/v1/actuator/health
              echo ""
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying in 2 seconds..."
            sleep 2
          done
          echo "Backend failed to become healthy within 120 seconds. Backend log output:"
          cat backend.log
          exit 1

      - name: Run Newman API tests (Quotes suite)
        working-directory: tests
        run: |
          mkdir -p reports
          npx newman run postman/insurance-workflow-api.postman_collection.json \
            -e postman/insurance-workflow-environment.postman_environment.json \
            --folder quotes \
            --reporters cli,json \
            --reporter-json-export reports/newman-results.json

      - name: Upload Newman API test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-api-test-report
          path: tests/reports/
          if-no-files-found: warn

      - name: Dump backend log on failure
        if: failure()
        run: |
          if [ -f backend.log ]; then
            echo "=== BACKEND LOG ==="
            cat backend.log
          fi
