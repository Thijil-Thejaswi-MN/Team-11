# Docker Compose for Team-11 Insurance Workflow Automation System
# Architecture:
# - MySQL 8.0 Relational Database (health checked, connection-pool headroom)
# - Two Backend Application Instances (Spring Boot 3, least_conn balanced, health checked)
# - Frontend Web Application (React SPA static server, health checked)
# - Nginx TLS Reverse Proxy (TLS 1.2/1.3 termination, HSTS, HTTP->HTTPS redirect)

services:
  db:
    image: mysql:8.0
    container_name: insurance-mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-insurance_db}
      MYSQL_USER: ${DB_USER:-insurance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --explicit_defaults_for_timestamp=true
      --max_connections=200
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - insurance-network

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-backend-1
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-insurance_db}
      DB_USER: ${DB_USER:-insurance_user}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      INSTANCE_ID: backend-instance-1
      HIKARI_POOL_NAME: HikariPool-Instance-1
      HIKARI_MAX_POOL_SIZE: 25
      HIKARI_MIN_IDLE: 5
      HIKARI_CONN_TIMEOUT: 20000
      HIKARI_IDLE_TIMEOUT: 300000
      HIKARI_MAX_LIFETIME: 1200000
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-key-minimum-256-bits-length-for-hmac-sha256-padding!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - insurance-network

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-backend-2
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-insurance_db}
      DB_USER: ${DB_USER:-insurance_user}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      INSTANCE_ID: backend-instance-2
      HIKARI_POOL_NAME: HikariPool-Instance-2
      HIKARI_MAX_POOL_SIZE: 25
      HIKARI_MIN_IDLE: 5
      HIKARI_CONN_TIMEOUT: 20000
      HIKARI_IDLE_TIMEOUT: 300000
      HIKARI_MAX_LIFETIME: 1200000
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-key-minimum-256-bits-length-for-hmac-sha256-padding!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - insurance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - insurance-network

  nginx:
    image: nginx:1.27-alpine
    container_name: insurance-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://localhost:443/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - insurance-network

networks:
  insurance-network:
    name: insurance-network
    driver: bridge

volumes:
  mysql_data:
    name: insurance-mysql_data
    driver: local
