server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: insurance-workflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Spring Boot Actuator Endpoints (Health Check & Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
