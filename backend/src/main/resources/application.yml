server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: insurance-workflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Spring Boot Actuator Endpoints (Health Check & Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Security Configuration (SAD §4.4, INS-SR-003, INS-SR-004)
# In production, these MUST be injected via environment variables (JWT_SECRET, ENCRYPTION_KEY).
# Startup fails securely if production keys are absent or insecure.
insurance:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: 900
  security:
    encryption-key: ${ENCRYPTION_KEY:}
